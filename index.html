<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0e9"><title>插單 · Capture Pad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f0e9;--card:#fffdf8;--ink:#292823;--muted:#7d786d;--line:#ded8cc;--accent:#596456;--danger:#8a5a54;--shadow:0 12px 36px rgba(55,48,38,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}main{max-width:720px;margin:auto;padding:24px 16px 80px}.top,.sectionhead,.statusrow{display:flex;align-items:center;justify-content:space-between}.top{align-items:end;margin:8px 2px 20px}.title{font-size:28px;font-weight:750;letter-spacing:.04em}.sub,.count,.tiny,.meta{color:var(--muted)}.sub{font-size:13px;margin-top:4px}.count{font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.label{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:9px}.capture{display:flex;gap:8px}.dateRow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}.dateRow label{font-size:12px;color:var(--muted)}input{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;font-size:14px;color:var(--ink);outline:none}.capture input{flex:1;border-radius:13px;padding:14px 13px;font-size:16px}.btn{border:0;border-radius:12px;padding:0 15px;background:var(--accent);color:white;font-weight:700;font-size:15px;cursor:pointer}.btn.secondary{background:#ece8df;color:var(--ink);padding:10px 12px}.btn.danger{background:#f0e4e1;color:var(--danger);padding:10px 12px}.now{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.nowtext{font-size:17px;font-weight:650;flex:1}.empty{color:var(--muted);font-size:14px}.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid #eee9df}.row:first-of-type{border-top:0}.check{width:22px;height:22px;border:1.5px solid #aaa497;border-radius:50%;background:transparent;cursor:pointer;flex:none;margin-top:1px}.body{flex:1;min-width:0}.text{font-size:15px;line-height:1.45;word-break:break-word}.meta{font-size:11px;margin-top:3px}.actions{display:flex;gap:5px}.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:2px 5px}.pin{color:var(--accent)}.sectiontitle{font-size:14px;font-weight:750}.done .text{text-decoration:line-through;color:#999388}.footer{text-align:center;font-size:11px;color:#918b80;margin-top:20px}.tiny{font-size:11px;margin-top:8px;line-height:1.5}.authgrid{display:grid;gap:9px}.authgrid input{width:100%}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--accent)}.status.bad{color:var(--danger)}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#ece8df;color:var(--muted)}.hidden{display:none!important}@media(max-width:480px){main{padding:16px 12px 72px}.title{font-size:25px}.card{border-radius:16px}.btn{padding:0 13px}.capture input{font-size:16px}}
</style></head><body><main>
<div class="top"><div><div class="title">插單</div><div class="sub">先記下來。不要現在處理。</div></div><div><div class="count" id="count"></div><div class="pill" id="cloudPill">未連接</div></div></div>
<section class="card" id="connectCard"><div class="sectiontitle">第一次連接</div><div class="tiny">只需要設定一次。Project URL 已先帶入；請貼上 Supabase 的 <b>Publishable key</b>。不要使用 Secret key。</div><div class="authgrid" style="margin-top:10px"><input id="sbUrl" value="https://xdymhrblfpwrnertsbre.supabase.co"><input id="sbKey" type="password" placeholder="sb_publishable_…"><button class="btn secondary" id="saveConnect">儲存連接設定</button><div id="connectStatus" class="status"></div></div></section>
<section class="card hidden" id="loginCard"><div class="sectiontitle">登入 Capture Pad</div><div class="tiny">使用妳剛才在 Supabase Authentication 建立的 Email 與密碼。</div><div class="authgrid" style="margin-top:10px"><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" id="loginBtn" style="height:44px">登入</button><div id="loginStatus" class="status"></div></div></section>
<div id="app" class="hidden">
<section class="card"><div class="label">現在有什麼不能忘？</div><form id="captureForm"><div class="capture"><input id="captureInput" autocomplete="off" placeholder="例如：○○居留證申請"><button class="btn">記下</button></div><div class="dateRow"><label for="dueDate">預計日期</label><input id="dueDate" type="date"><button type="button" class="btn secondary" id="todayBtn">今天</button><button type="button" class="btn secondary" id="clearDateBtn">不指定</button></div></form><div class="tiny">新增、完成、釘選與日期變更會自動同步。</div></section>
<section class="card"><div class="sectionhead"><div class="sectiontitle">正在做</div><button class="btn secondary" id="clearNow">清除</button></div><div id="nowBox"></div></section>
<section class="card"><div class="sectionhead"><div class="sectiontitle">尚未完成</div><span class="count" id="openCount"></span></div><div id="openList"></div></section>
<section class="card"><div class="sectionhead"><div class="sectiontitle">今天完成</div><button class="btn danger" id="clearDone">清掉完成項</button></div><div id="doneList"></div></section>
<section class="card"><div class="statusrow"><div><div class="sectiontitle">帳號</div><div id="who" class="tiny"></div></div><button class="btn secondary" id="logoutBtn">登出</button></div></section>
</div><div class="footer">Capture Pad v0.4 · Supabase Auth + Realtime</div></main>
<script>
const LOCAL='capturePad.v01.items', NOW='capturePad.v01.now', CFG='capturePad.v04.connection'; const $=s=>document.querySelector(s); let client=null,user=null,items=[],current=localStorage.getItem(NOW)||'',channel=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function stamp(ts){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts))} function dueLabel(d){if(!d)return'';const[y,m,day]=d.split('-').map(Number),dt=new Date(y,m-1,day),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),diff=Math.round((dt-t)/86400000);return diff===0?'今天':diff===1?'明天':diff===-1?'昨天':`${m}/${day}`} function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function pill(t,c=''){const e=$('#cloudPill');e.textContent=t;e.className='pill '+c} function show(el,on){$(el).classList.toggle('hidden',!on)}
function render(){const open=items.filter(x=>!x.is_completed).sort((a,b)=>(b.is_pinned-a.is_pinned)||((a.planned_date||'9999').localeCompare(b.planned_date||'9999'))||new Date(b.updated_at)-new Date(a.updated_at)),done=items.filter(x=>x.is_completed).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));$('#count').textContent=`${open.length} 件待處理`;$('#openCount').textContent=open.length?`${open.length} 件`:'';$('#nowBox').innerHTML=current?`<div class="now"><span class="dot"></span><div class="nowtext">${esc(current)}</div></div>`:`<div class="empty">目前沒有設定。從下方事項按「▶」即可。</div>`;$('#openList').innerHTML=open.length?open.map(x=>`<div class="row"><button class="check" onclick="completeItem('${x.id}')"></button><div class="body"><div class="text">${esc(x.content)}</div><div class="meta">${x.planned_date?`預計 ${dueLabel(x.planned_date)} · `:''}記錄 ${stamp(x.created_at)}${x.is_pinned?' · 已釘選':''}</div></div><div class="actions"><button class="icon" onclick="setNow('${x.id}')">▶</button><button class="icon ${x.is_pinned?'pin':''}" onclick="togglePin('${x.id}')">⌖</button><button class="icon" onclick="deleteItem('${x.id}')">×</button></div></div>`).join(''):`<div class="empty">很好，暫時沒有東西追著妳跑。</div>`;$('#doneList').innerHTML=done.length?done.slice(0,20).map(x=>`<div class="row done"><div class="body"><div class="text">${esc(x.content)}</div><div class="meta">完成 ${stamp(x.updated_at)}</div></div><button class="icon" onclick="undoItem('${x.id}')">↶</button></div>`).join(''):`<div class="empty">今天還沒有完成紀錄。</div>`}
async function loadItems(){pill('同步中…');const {data,error}=await client.from('capture_items').select('*').order('created_at',{ascending:true});if(error){pill('同步失敗','bad');throw error}items=data||[];render();pill('● 已同步','ok')}
async function migrateLocal(){const raw=JSON.parse(localStorage.getItem(LOCAL)||'[]'); if(!raw.length)return; const existing=new Set(items.map(x=>x.id)); const payload=raw.filter(x=>!existing.has(x.id)).map(x=>({id:x.id,user_id:user.id,content:x.text,planned_date:x.due||null,is_pinned:!!x.pin,is_completed:!!x.done,is_active:false,created_at:new Date(x.ts||Date.now()).toISOString(),updated_at:new Date(x.updated||x.ts||Date.now()).toISOString()})); if(payload.length){const {error}=await client.from('capture_items').insert(payload);if(!error){localStorage.removeItem(LOCAL);await loadItems()}}}
function subscribe(){if(channel)client.removeChannel(channel);channel=client.channel('capture-items-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'capture_items',filter:`user_id=eq.${user.id}`},()=>loadItems()).subscribe()}
async function startApp(){show('#connectCard',false);show('#loginCard',false);show('#app',true);$('#who').textContent=user.email||'';await loadItems();await migrateLocal();subscribe()}
async function init(){const cfg=JSON.parse(localStorage.getItem(CFG)||'{}');if(!cfg.url||!cfg.key){show('#connectCard',true);show('#loginCard',false);show('#app',false);return}$('#sbUrl').value=cfg.url;client=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await client.auth.getSession();if(session?.user){user=session.user;startApp()}else{show('#connectCard',false);show('#loginCard',true);show('#app',false);pill('待登入')}}
$('#saveConnect').onclick=async()=>{const url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();if(!url||!key){$('#connectStatus').textContent='請填 Project URL 與 Publishable key';return}localStorage.setItem(CFG,JSON.stringify({url,key}));$('#connectStatus').textContent='已儲存。';await init()};
$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;$('#loginStatus').textContent='登入中…';const {data,error}=await client.auth.signInWithPassword({email,password});if(error){$('#loginStatus').textContent='登入失敗：'+error.message;return}user=data.user;$('#loginStatus').textContent='';await startApp()};
$('#logoutBtn').onclick=async()=>{await client.auth.signOut();user=null;if(channel)client.removeChannel(channel);show('#app',false);show('#loginCard',true);pill('已登出')};
$('#captureForm').onsubmit=async e=>{e.preventDefault();const input=$('#captureInput'),content=input.value.trim();if(!content)return;pill('同步中…');const {error}=await client.from('capture_items').insert({user_id:user.id,content,planned_date:$('#dueDate').value||null});if(error){pill('新增失敗','bad');return}input.value='';$('#dueDate').value='';input.focus();await loadItems()};
window.completeItem=async id=>{await client.from('capture_items').update({is_completed:true}).eq('id',id);const x=items.find(x=>x.id===id);if(x&&current===x.content){current='';localStorage.setItem(NOW,current)}await loadItems()};window.undoItem=async id=>{await client.from('capture_items').update({is_completed:false}).eq('id',id);await loadItems()};window.togglePin=async id=>{const x=items.find(x=>x.id===id);if(x){await client.from('capture_items').update({is_pinned:!x.is_pinned}).eq('id',id);await loadItems()}};window.deleteItem=async id=>{await client.from('capture_items').delete().eq('id',id);await loadItems()};window.setNow=id=>{const x=items.find(x=>x.id===id);if(x){current=x.content;localStorage.setItem(NOW,current);render()}};
$('#todayBtn').onclick=()=>$('#dueDate').value=todayISO();$('#clearDateBtn').onclick=()=>$('#dueDate').value='';$('#clearNow').onclick=()=>{current='';localStorage.setItem(NOW,current);render()};$('#clearDone').onclick=async()=>{const ids=items.filter(x=>x.is_completed).map(x=>x.id);if(ids.length){await client.from('capture_items').delete().in('id',ids);await loadItems()}};window.addEventListener('online',()=>loadItems().catch(()=>{}));init();
</script></body></html>
