<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141817">
<title>插單 · Capture Pad</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="插單">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;
  --bg:#141817;--surface:#1c211f;--raised:#232927;--line:#2f3633;--line-soft:#262c2a;
  --ink:#e7e3d9;--muted:#9a9e96;--faint:#6f746d;
  --accent:#8fb5a1;--accent-ink:#10201a;--accent-soft:rgba(143,181,161,.13);
  --danger:#d99a8e;--danger-soft:rgba(217,154,142,.12);--warn:#d8b06a;
  --radius:14px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(143,181,161,.3)}
.hidden{display:none!important}

/* 正在做：整個頁面唯一的重點 */
.focusBar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 76%,rgba(20,24,23,0));padding:calc(14px + env(safe-area-inset-top)) 22px 12px}
.focusCard{max-width:1500px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:11px 12px 11px 16px;display:flex;gap:14px;align-items:center}
.focusCard.on{border-left-color:var(--accent)}
.focusDot{display:none}
.focusMain{flex:1;min-width:0}
.focusLabel{font-size:11px;color:var(--muted);letter-spacing:.08em}
.focusText{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.02em;margin-top:1px;word-break:break-word}
.focusCard:not(.on) .focusText{font-family:var(--sans);font-weight:400;font-size:13.5px;color:var(--faint);letter-spacing:0}
.focusPrev{font-size:12px;color:var(--muted);margin-top:3px}
.focusPrev:empty{display:none}
.focusSide{display:flex;gap:8px;align-items:center;flex:none}
.pill{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--accent)}
.pill.bad{color:var(--danger);border-color:rgba(217,154,142,.4);background:var(--danger-soft)}

/* 三欄 */
.workspace{max-width:1500px;margin:4px auto 0;padding:0 22px 20px;display:grid;grid-template-columns:minmax(300px,.95fr) minmax(360px,1.15fr) minmax(280px,.9fr);gap:16px;align-items:start}
.col{min-width:0}
.colHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px 10px}
.colHead h2{margin:0;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.08em}
.colHint{font-size:11px;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.label{font-size:12px;color:var(--muted);margin-bottom:8px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sectiontitle{font-size:13.5px;font-weight:700;letter-spacing:.02em}
.count{font-size:12px;color:var(--faint)}
input,textarea{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 10px;font-size:16px;outline:none;min-width:0;width:100%;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{border-color:var(--accent)}
.capture{display:flex;gap:8px}
.capture input{flex:1;padding:11px 12px;border-radius:10px}
.dateRow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.dateRow label{font-size:12px;color:var(--muted);margin-right:2px}
.dateRow input{width:auto;padding:5px 9px;font-size:13.5px}
.btn{border:0;border-radius:9px;padding:0 16px;min-height:42px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:12.5px;min-height:30px;padding:0 10px;border-radius:8px}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.danger{background:transparent;border:1px solid rgba(217,154,142,.35);color:var(--danger);font-weight:500;font-size:12.5px;min-height:30px;padding:0 10px;border-radius:8px}
.btn.danger:hover{background:var(--danger-soft);filter:none}
.btn.ghost{background:transparent;color:var(--muted);font-size:12px;min-height:28px;padding:0 8px;font-weight:600}
.btn.ghost:hover{color:var(--ink);filter:none}
.tiny{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
.tiny:empty{display:none}
.empty{color:var(--faint);font-size:13px;padding:6px 0}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.row:first-child{border-top:0}
.check{width:20px;height:20px;border:1.5px solid #59605c;border-radius:50%;background:transparent;flex:none;margin-top:1px;padding:0;transition:border-color .15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.body{flex:1;min-width:0}
.text{font-size:14.5px;line-height:1.45;word-break:break-word}
.meta{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.due{color:var(--accent);font-weight:600}
.due.late{color:var(--danger)}
.due.soon{color:var(--warn)}
.actions{display:flex;flex:none}
.icon{border:0;background:transparent;color:var(--faint);font-size:14px;width:30px;height:30px;border-radius:7px;padding:0}
.icon:hover{background:var(--raised);color:var(--ink)}
.icon.pin{color:var(--accent)}
.done .text{text-decoration:line-through;color:var(--faint)}
.isNow .text{color:var(--accent);font-weight:700}

/* 案件 */
.caseForm{display:flex;gap:8px}
.caseCard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.caseCard[open]{border-color:#3b4440}
.caseCard summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 12px 12px 14px;cursor:pointer}
.caseCard summary::-webkit-details-marker{display:none}
.caseTitle{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.03em;flex:1;min-width:0;word-break:break-word}
.progress{font-size:11.5px;color:var(--muted);background:var(--raised);padding:2px 8px;border-radius:999px}
.progress:empty{display:none}
.chev{color:var(--faint);transition:transform .15s}
.caseCard[open] .chev{transform:rotate(180deg)}
.caseBody{border-top:1px solid var(--line);padding:12px 14px 14px}
.caseNote{min-height:64px;resize:vertical;line-height:1.55;font-size:14px}
.subRow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.subRow .text{font-weight:600}
.subform{display:grid;gap:9px}
.field{display:grid;gap:5px;min-width:0}
.fieldCaption{font-size:11px;color:var(--muted);font-weight:600}
.fieldRow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.clickable{cursor:pointer;border-radius:8px}
.clickable:hover .text{color:var(--accent)}
.subNote{font-size:12px;color:#bcb7ac;margin-top:5px;padding-left:8px;border-left:2px solid var(--line);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.subRow.editing{border-bottom:0}
.subEdit{display:grid;gap:9px;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:12px;margin:0 0 10px 30px}
.subEdit input,.subEdit textarea{background:var(--surface)}
.subEdit .caseFoot{margin-top:2px}
.ruleHint{font-weight:500;color:var(--accent);margin-left:6px}
select{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:9px 10px;font-size:16px;width:100%;min-width:0;outline:none}
select:focus{border-color:var(--accent)}
.subEdit select{background:var(--surface)}
.subform:empty{display:none}
.tag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;color:var(--accent);border:1px solid rgba(143,181,161,.35);border-radius:5px;padding:0 5px;vertical-align:2px;line-height:1.6}
.expCap{display:flex;align-items:center;gap:2px}
.plusBtn{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:6px;font-size:11px;font-weight:600;padding:1px 7px;line-height:1.6}
.plusBtn:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px dashed #48524d;background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.caseFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}

/* 近期 */
.upGroup{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:14px 2px 7px}
.upGroup::after{content:"";flex:1;height:1px;background:var(--line)}
.upGroup:first-child{margin-top:0}
.upGroup.late{color:var(--danger)}
.upGroup .n{font-weight:500;color:var(--faint)}
.upItem{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 4px 9px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.upItem.late{border-color:rgba(217,154,142,.28)}
.upDate{font-size:12px;font-weight:700;color:var(--accent);width:78px;flex:none;padding-top:2px}
.upItem.late .upDate{color:var(--danger)}
.upTitle{font-size:13.5px;font-weight:600;word-break:break-word}

/* 登入 */
.gate{max-width:440px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 16px 40px}
.gateTitle{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.1em}
.gateSub{color:var(--muted);font-size:13px;margin:4px 0 20px}
.authgrid{display:grid;gap:9px;margin-top:10px}
.status{font-size:12px;color:var(--muted)}
body.locked .focusBar,body.locked .workspace,body.locked .tabs,body.locked .footer{display:none}

.footer{text-align:center;font-size:11px;color:var(--faint);padding:6px 16px 30px}
.footer .who{margin-right:4px}

/* 手機：底部分頁 */
.tabs{display:none}
@media(max-width:980px){
  .focusBar{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .focusText{font-size:16px}
  .workspace{display:block;padding:0 14px 10px}
  .col{display:none}
  body[data-tab="general"] #col-general,
  body[data-tab="cases"] #col-cases,
  body[data-tab="upcoming"] #col-upcoming{display:block}
  .footer{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabs{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:rgba(28,33,31,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:11px 0;font-weight:600;font-size:14px;color:var(--muted)}
  .tabs button.active{background:var(--accent-soft);color:var(--accent)}
  .tabs .n{font-size:11px;margin-left:4px;font-weight:500}
  .tabs .n.late{color:var(--danger);font-weight:700}
  .fieldRow{grid-template-columns:1fr}
  .subEdit{margin-left:0}
}
@media(min-width:981px){input,textarea,select{font-size:14px}.capture input{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked" data-tab="general">

<!-- 登入／連接 -->
<div id="gate" class="gate">
  <div class="gateTitle">插單</div>
  <div class="gateSub">先記下來。不要現在處理。</div>
  <form class="card hidden" id="connectCard">
    <div class="sectiontitle">第一次連接</div>
    <div class="tiny">只需要設定一次。Project URL 已先帶入；請貼上 Supabase 的 <b>Publishable key</b>。不要使用 Secret key。</div>
    <div class="authgrid">
      <input id="sbUrl" value="https://xdymhrblfpwrnertsbre.supabase.co">
      <input id="sbKey" type="password" placeholder="sb_publishable_…">
      <button class="btn">儲存連接設定</button>
      <div id="connectStatus" class="status"></div>
    </div>
  </form>
  <form class="card hidden" id="loginCard">
    <div class="sectiontitle">登入</div>
    <div class="tiny">使用妳在 Supabase Authentication 建立的 Email 與密碼。</div>
    <div class="authgrid">
      <input id="email" type="email" autocomplete="username" placeholder="Email">
      <input id="password" type="password" autocomplete="current-password" placeholder="密碼">
      <button class="btn">登入</button>
      <div id="loginStatus" class="status"></div>
    </div>
  </form>
</div>

<!-- 正在做（全域） -->
<header class="focusBar">
  <div class="focusCard" id="focusCard">
    <span class="focusDot"></span>
    <div class="focusMain">
      <div class="focusLabel">正在做</div>
      <div class="focusText" id="focusText"></div>
      <div class="focusPrev" id="focusPrev"></div>
    </div>
    <div class="focusSide">
      <button class="btn secondary hidden" id="clearNow" data-act="clearNow">清除</button>
      <span class="pill" id="cloudPill">未連接</span>
    </div>
  </div>
</header>

<div class="workspace">
  <section id="col-general" class="col">
    <div class="colHead"><h2>一般</h2><span class="colHint">先記下來，不要現在處理</span></div>
    <form class="card" id="captureForm">
      <div class="label">現在有什麼不能忘？</div>
      <div class="capture">
        <input id="captureInput" autocomplete="off" enterkeyhint="done" placeholder="例如：○○居留證申請">
        <button class="btn">記下</button>
      </div>
      <div class="dateRow">
        <label for="dueDate">預計日期</label>
        <input id="dueDate" type="date">
        <button type="button" class="btn secondary" data-act="date" data-off="0">今天</button>
        <button type="button" class="btn secondary" data-act="date" data-off="1">明天</button>
        <button type="button" class="btn secondary" data-act="date" data-off="">不指定</button>
      </div>
    </form>
    <section class="card">
      <div class="sectionhead"><div class="sectiontitle">尚未完成</div><span class="count" id="openCount"></span></div>
      <div id="openList"></div>
    </section>
    <section class="card">
      <div class="sectionhead"><div class="sectiontitle">今天完成</div><button class="btn danger hidden" id="clearDone" data-act="clearDone">清掉完成項</button></div>
      <div id="doneList"></div>
      <div class="tiny" id="doneNote"></div>
    </section>
  </section>

  <section id="col-cases" class="col">
    <div class="colHead"><h2>案件</h2><span class="colHint">長流程與子任務</span></div>
    <form class="card" id="caseForm">
      <div class="label">新增案件</div>
      <div class="caseForm"><input id="caseName" autocomplete="off" placeholder="例如：苗林新案"><button class="btn">新增</button></div>
    </form>
    <div id="caseList"></div>
  </section>

  <section id="col-upcoming" class="col">
    <div class="colHead"><h2>近期</h2><span class="colHint">只看有日期的事</span></div>
    <div id="upcomingList"></div>
  </section>
</div>

<footer class="footer">
  <span class="who" id="who"></span>
  <button class="btn ghost" data-act="logout">登出</button>
  <button class="btn ghost" data-act="reset">重設連接</button>
  <div>Capture Pad v1.3.2</div>
</footer>

<nav class="tabs" aria-label="切換頁面">
  <button data-act="tab" data-tab="general">一般<span class="n" id="n-general"></span></button>
  <button data-act="tab" data-tab="cases">案件<span class="n" id="n-cases"></span></button>
  <button data-act="tab" data-tab="upcoming">近期<span class="n" id="n-upcoming"></span></button>
</nav>

<script>
const K={items:'capturePad.v01.items',now:'capturePad.v01.now',prev:'capturePadPrevNow',cfg:'capturePad.v04.connection',tab:'capturePad.tab',open:'capturePad.openCases'};
const $=s=>document.querySelector(s);
const store={get(k,d=''){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{(v===''||v==null)?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
let client=null,user=null,channel=null,items=[],cases=[],subs={};
let current=store.get(K.now),prev=store.get(K.prev);
let openCases=new Set((()=>{try{return JSON.parse(store.get(K.open,'[]'))}catch{return[]}})());

/* ---------- 小工具 ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const WD='日一二三四五六';
const stamp=ts=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts));
const parseD=d=>{const[y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day)};
const iso=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const todayISO=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return iso(d)};
const dayDiff=d=>{const n=new Date();return Math.round((parseD(d)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
const isToday=ts=>iso(new Date(ts))===todayISO();
function dueLabel(d){if(!d)return'';const x=dayDiff(d),dt=parseD(d);if(x===0)return'今天';if(x===1)return'明天';if(x===2)return'後天';if(x===-1)return'昨天';return`${dt.getMonth()+1}/${dt.getDate()}（${WD[dt.getDay()]}）`}
// ── 子任務類型：決定要填哪些日期、效期怎麼算（之後要加類型就加在這裡）
const addDays=(d,n)=>{const dt=parseD(d);dt.setDate(dt.getDate()+n);return iso(dt)};
// 「發文日起算 N 個月」：到期日為對應日當天（例：2026/9/17 +1 年 → 2027/9/17）；該月沒有對應日時為月底
function termEnd(d,months){
  const s=parseD(d),m=s.getMonth()+months,ty=s.getFullYear()+Math.floor(m/12),tm=((m%12)+12)%12,day=s.getDate();
  const last=new Date(ty,tm+1,0).getDate();
  return iso(new Date(ty,tm,Math.min(day,last)));
}
const TYPES={
  general:{label:'一般（不需日期）'},
  jc:{label:'求才證明書',short:'求才證明',from:'領證日',rule:'領證日 +90 天',calc:d=>addDays(d,90),match:/求才/},
  nv:{label:'無違反法令證明書',short:'無違反',from:'領證日',rule:'領證日 +90 天',calc:d=>addDays(d,90),match:/無違/},
  mol:{label:'勞動部函（初次招募）',short:'招募函',from:'發文日',rule:'發文日起算一年',calc:d=>termEnd(d,12),match:/勞動部函|招募函/},
  entry:{label:'入國引進函－入簽（初招）',short:'入簽',from:'發文日',rule:'發文日起算 9 個月',calc:d=>termEnd(d,9),match:/入簽|入國|引進/},
  reentry:{label:'入國引進函－重入簽（重招）',short:'重入簽',from:'發文日',rule:'手動填寫',match:/重入簽/},
  takeover:{label:'承接登記',short:'承接登記',from:'登記日',expLabel:'登記到期日',rule:'登記日 +60 天',calc:d=>addDays(d,60),match:/承接/},
  verify:{label:'國籍驗證文件',short:'驗證',dhl:true,match:/驗證/}
};
const TYPE_ORDER=['general','jc','nv','mol','entry','reentry','takeover','verify'];
const TPL=[['求才證明書','jc'],['無違反法令證明書','nv'],['勞動部函（初次招募）','mol'],['入簽','entry'],['重入簽','reentry'],['承接登記','takeover'],['國籍驗證文件','verify']];
function guessType(name){for(const k of ['takeover','reentry','entry','jc','nv','mol','verify'])if(TYPES[k].match.test(name||''))return k;return 'general'}
const typeOf=x=>(x.doc_type&&TYPES[x.doc_type])?x.doc_type:guessType(x.content);
const ymd=d=>{const dt=parseD(d);return`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`};
let openSubs=new Set();
function pill(t,c=''){const e=$('#cloudPill');e.textContent=t;e.className='pill '+c}
function show(sel,on){$(sel).classList.toggle('hidden',!on)}
async function run(p){pill('同步中…');const {error}=await p;if(error){console.error(error);pill('同步失敗','bad');
  const m=error.message||'';if(/notes|issue_date|doc_type|dhl_date/.test(m))alert('資料庫還沒有新欄位。請先到 Supabase 的 SQL Editor 執行更新用的 SQL，再試一次。');
  return false}return true}

/* ---------- 正在做 ---------- */
function setCurrent(text){if(current&&current!==text){prev=current;store.set(K.prev,prev)}current=text;store.set(K.now,current);renderAll()}
function clearCurrent(){if(current){prev=current;store.set(K.prev,prev)}current='';store.set(K.now,'');renderAll()}
function returnPrev(){if(!prev)return;const n=current;current=prev;prev=n||'';store.set(K.now,current);store.set(K.prev,prev);renderAll()}
function renderFocus(){
  const on=!!current;
  $('#focusCard').classList.toggle('on',on);
  $('#focusText').textContent=on?current:'還沒設定。按任何事項旁的 ▶。';
  $('#focusPrev').innerHTML=(prev&&prev!==current)?`剛才做到：${esc(prev)} <button class="btn ghost" data-act="back">↩ 回去</button>`:'';
  show('#clearNow',on);
}

/* ---------- 一般 ---------- */
function renderGeneral(){
  const open=items.filter(x=>!x.is_completed).sort((a,b)=>(b.is_pinned-a.is_pinned)||(a.planned_date||'9999').localeCompare(b.planned_date||'9999')||(new Date(b.updated_at)-new Date(a.updated_at)));
  const doneAll=items.filter(x=>x.is_completed).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
  const doneToday=doneAll.filter(x=>isToday(x.updated_at));
  $('#openCount').textContent=open.length?`${open.length} 件`:'';
  $('#openList').innerHTML=open.length?open.map(x=>{
    const late=x.planned_date&&dayDiff(x.planned_date)<0,bits=[];
    if(x.planned_date)bits.push(`<span class="due${late?' late':''}">${late?'逾期':'預計'} ${dueLabel(x.planned_date)}</span>`);
    bits.push('記錄 '+stamp(x.created_at));
    if(x.is_pinned)bits.push('已釘選');
    return `<div class="row${current===x.content?' isNow':''}">
      <button class="check" data-act="done" data-id="${x.id}" aria-label="完成"></button>
      <div class="body"><div class="text">${esc(x.content)}</div><div class="meta">${bits.join(' · ')}</div></div>
      <div class="actions">
        <button class="icon" data-act="now" data-id="${x.id}" title="設為正在做" aria-label="設為正在做">▶</button>
        <button class="icon${x.is_pinned?' pin':''}" data-act="pin" data-id="${x.id}" title="釘選" aria-label="釘選">⌖</button>
        <button class="icon" data-act="del" data-id="${x.id}" title="刪除" aria-label="刪除">×</button>
      </div></div>`}).join(''):`<div class="empty">很好，暫時沒有東西追著妳跑。</div>`;
  $('#doneList').innerHTML=doneToday.length?doneToday.map(x=>`<div class="row done">
      <div class="body"><div class="text">${esc(x.content)}</div><div class="meta">完成 ${stamp(x.updated_at)}</div></div>
      <button class="icon" data-act="undo" data-id="${x.id}" title="還原" aria-label="還原">↶</button></div>`).join(''):`<div class="empty">今天還沒有完成紀錄。</div>`;
  const older=doneAll.length-doneToday.length;
  $('#doneNote').textContent=older?`另有 ${older} 筆較早完成的紀錄。`:'';
  show('#clearDone',doneAll.length>0);
  return open.length;
}

/* ---------- 案件 ---------- */
const F=(key,role)=>document.getElementById(`${key}-${role}`);
function typeSelect(key,t,manual){
  return `<select id="${key}-type" data-key="${key}" data-role="type"${manual?' data-manual="1"':''}>${TYPE_ORDER.map(k=>`<option value="${k}"${k===t?' selected':''}>${TYPES[k].label}</option>`).join('')}</select>`;
}
function dateInput(key,role,caption,val,hint=''){
  return `<div class="field"><span class="fieldCaption">${caption}${hint?`<span class="ruleHint">${hint}</span>`:''}</span><input id="${key}-${role}" data-key="${key}" data-role="${role}" type="date" value="${val||''}"></div>`;
}
// 依類型決定要出現哪些日期欄位
function dateFields(key,t,v){
  const T=TYPES[t];let h='';
  if(T.from)h+=`<div class="fieldRow">${dateInput(key,'from',T.from,v.from)}${dateInput(key,'exp',T.expLabel||'效期到期日',v.exp,T.rule)}</div>`;
  else if(v.from||v.exp)h+=`<div class="fieldRow">${v.from?dateInput(key,'from','領證／發文日',v.from):''}${v.exp?dateInput(key,'exp','效期到期日',v.exp):''}</div>`;
  if(T.dhl||v.dhl)h+=dateInput(key,'dhl','DHL 寄國外日',v.dhl);
  return h;
}
function rebuildDates(key,src){
  const box=F(key,'dates'),sel=F(key,'type');if(!box||!sel)return;
  const get=r=>(src&&src[`${key}-${r}`]!=null)?src[`${key}-${r}`]:(F(key,r)?.value||'');
  box.innerHTML=dateFields(key,sel.value,{from:get('from'),exp:get('exp'),dhl:get('dhl')});
}
function recalc(key){
  const T=TYPES[F(key,'type')?.value],from=F(key,'from'),exp=F(key,'exp');
  if(T&&T.calc&&from&&from.value&&exp)exp.value=T.calc(from.value);
}
function onField(e){
  const el=e.target,key=el.dataset&&el.dataset.key,role=el.dataset&&el.dataset.role;if(!key)return;
  if(role==='type'){if(e.type==='change')el.dataset.manual='1';rebuildDates(key);recalc(key)}
  else if(role==='from')recalc(key);
  else if(role==='name'){
    const sel=F(key,'type');if(!sel||sel.dataset.manual)return;
    const g=guessType(el.value);if(sel.value!==g){sel.value=g;rebuildDates(key);recalc(key)}
  }
}

function subRowHTML(c,x){
  const t=typeOf(x),T=TYPES[t],exp=x.expiry_date,dd=exp?dayDiff(exp):null;
  const late=!x.is_completed&&exp&&dd<0,soon=!x.is_completed&&exp&&dd>=0&&dd<=14;
  const meta=[
    x.status?esc(x.status):'',
    x.issue_date?`${T.from||'日期'} ${ymd(x.issue_date)}`:'',
    exp?`<span class="due${late?' late':soon?' soon':''}">${late?'已過期':(T.expLabel?'到期':'效期到')} ${ymd(exp)}${soon||late?`（${dueLabel(exp)}）`:''}</span>`:'',
    x.dhl_date?`DHL 寄出 ${ymd(x.dhl_date)}`:'',
    x.task_date?`辦理 ${dueLabel(x.task_date)}`:''
  ].filter(Boolean).join(' · ');
  const editing=openSubs.has(x.id),key='se-'+x.id;
  let html=`<div class="subRow${x.is_completed?' done':''}${editing?' editing':''}">
    <button class="check${x.is_completed?' on':''}" data-act="sub-toggle" data-cid="${c.id}" data-id="${x.id}" aria-label="${x.is_completed?'改回未完成':'完成'}"></button>
    <div class="body clickable" data-act="sub-edit" data-cid="${c.id}" data-id="${x.id}" title="點擊編輯">
      <div class="text">${esc(x.content)}${T.short?`<span class="tag">${T.short}</span>`:''}</div>${meta?`<div class="meta">${meta}</div>`:''}
      ${x.notes&&!editing?`<div class="subNote">${esc(x.notes)}</div>`:''}
    </div>
    <div class="actions">
      <button class="icon" data-act="sub-now" data-cid="${c.id}" data-id="${x.id}" title="設為正在做" aria-label="設為正在做">▶</button>
      <button class="icon" data-act="sub-del" data-cid="${c.id}" data-id="${x.id}" title="刪除" aria-label="刪除">×</button>
    </div></div>`;
  if(editing)html+=`<div class="subEdit">
    <div class="field"><span class="fieldCaption">名稱</span><input id="${key}-name" data-key="${key}" data-role="name" value="${esc(x.content)}"></div>
    <div class="fieldRow">
      <div class="field"><span class="fieldCaption">類型</span>${typeSelect(key,t,!!x.doc_type)}</div>
      <div class="field"><span class="fieldCaption">狀態</span><input id="${key}-status" value="${esc(x.status||'')}" placeholder="例如：審查中"></div>
    </div>
    <div id="${key}-dates" class="subform">${dateFields(key,t,{from:x.issue_date,exp,dhl:x.dhl_date})}</div>
    ${x.task_date?`<div class="tiny" style="margin-top:0">舊的辦理日：${ymd(x.task_date)} <button class="btn ghost" data-act="sub-cleartask" data-cid="${c.id}" data-id="${x.id}">清除</button></div>`:''}
    <div class="field"><span class="fieldCaption">備註</span><textarea id="${key}-notes" class="caseNote" placeholder="例如：文號、承辦人、補件內容…">${esc(x.notes||'')}</textarea></div>
    <div class="caseFoot"><button class="btn ghost" data-act="sub-edit" data-cid="${c.id}" data-id="${x.id}">取消</button><button class="btn" style="min-height:38px" data-act="sub-save" data-cid="${c.id}" data-id="${x.id}">儲存</button></div>
  </div>`;
  return html;
}
function renderCases(){
  const box=$('#caseList');
  // 重繪前保留輸入中的內容與游標，避免同步時打到一半被清掉
  const saved={};box.querySelectorAll('input[id],select[id],textarea[id$="-notes"]').forEach(el=>saved[el.id]=el.value);
  const manual={};box.querySelectorAll('select[data-manual]').forEach(el=>manual[el.id]=1);
  const act=document.activeElement,actId=box.contains(act)?act.id:null;
  const sel=actId&&typeof act.selectionStart==='number'?[act.selectionStart,act.selectionEnd]:null;
  if(actId&&act.tagName==='TEXTAREA')saved[actId]=act.value;

  box.innerHTML=cases.length?cases.map(c=>{
    const a=subs[c.id]||[],d=a.filter(x=>x.is_completed).length,key='c-'+c.id;
    return `<details class="caseCard" data-cid="${c.id}"${openCases.has(c.id)?' open':''}>
      <summary><span class="caseTitle">${esc(c.name)}</span><span class="progress">${a.length?`${d}/${a.length}`:''}</span><span class="chev">⌄</span></summary>
      <div class="caseBody">
        <div class="label">備註</div>
        <textarea id="note-${c.id}" class="caseNote" data-note="${c.id}" placeholder="目前進度、待追蹤事項…">${esc(c.notes||'')}</textarea>
        <div class="tiny" style="margin-top:4px">離開輸入框就會自動儲存。</div>
        <div class="label" style="margin-top:14px">子任務<span style="margin-left:6px">點名稱可編輯</span></div>
        ${a.length?a.map(x=>subRowHTML(c,x)).join(''):'<div class="empty">還沒有子任務。</div>'}
        <div class="label" style="margin-top:16px">新增子任務</div>
        <div class="subform">
          <div class="chips"><span class="fieldCaption">常用</span>
            ${TPL.map(([name,t])=>`<button type="button" class="chip" data-act="sub-tpl" data-cid="${c.id}" data-name="${name}" data-type="${t}">${name}</button>`).join('')}
          </div>
          <div class="field"><span class="fieldCaption">子任務</span><input id="${key}-name" data-key="${key}" data-role="name" data-enter="${c.id}" enterkeyhint="done" placeholder="例如：求才登記"></div>
          <div class="fieldRow">
            <div class="field"><span class="fieldCaption">類型</span>${typeSelect(key,'general',false)}</div>
            <div class="field"><span class="fieldCaption">狀態</span><input id="${key}-status" data-enter="${c.id}" enterkeyhint="done" placeholder="例如：審查中"></div>
          </div>
          <div id="${key}-dates" class="subform"></div>
        </div>

          <button class="btn ghost" style="color:var(--danger)" data-act="case-del" data-cid="${c.id}">刪除案件</button>
          <button class="btn" style="min-height:40px" data-act="sub-add" data-cid="${c.id}">＋ 新增子任務</button>
        </div>
      </div></details>`}).join(''):'<div class="card empty">還沒有案件。在上面輸入名稱就能新增。</div>';

  // 還原：先還原類型，依類型重建日期欄位，再還原其他值
  box.querySelectorAll('select[data-role="type"]').forEach(s=>{
    if(saved[s.id]!=null)s.value=saved[s.id];

  });
  Object.entries(saved).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&el.tagName!=='SELECT')el.value=v});
  if(actId){const el=document.getElementById(actId);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch{}}}

/* ---------- 近期 ---------- */
function renderUpcoming(){
  const u=[];
  items.filter(x=>!x.is_completed&&x.planned_date).forEach(x=>u.push({d:x.planned_date,t:x.content,m:'一般事項'}));
  cases.forEach(c=>(subs[c.id]||[]).filter(x=>!x.is_completed).forEach(x=>{
    const t=c.name+' › '+x.content;
    if(x.task_date)u.push({d:x.task_date,t,m:x.status?`${x.status}・辦理日`:'辦理日'});
    const T=TYPES[typeOf(x)];
    if(x.expiry_date)u.push({d:x.expiry_date,t,m:T.expLabel?`${T.short}到期`:`${T.short||''}效期到期`+(x.issue_date?`・${T.from||''} ${ymd(x.issue_date)}`:'')});
    if(x.dhl_date&&dayDiff(x.dhl_date)>=0)u.push({d:x.dhl_date,t,m:'DHL 寄國外日'});
  }));
  u.sort((a,b)=>a.d.localeCompare(b.d));
  const groups=[['逾期',x=>x<0,'late'],['今天',x=>x===0,''],['七天內',x=>x>0&&x<=7,''],['之後',x=>x>7,'']];
  let html='';
  groups.forEach(([name,f,cls])=>{
    const g=u.filter(x=>f(dayDiff(x.d)));if(!g.length)return;
    html+=`<div class="upGroup ${cls}">${name}<span class="n">${g.length}</span></div>`+g.slice(0,40).map(x=>`<div class="upItem ${cls}">
      <div class="upDate">${dueLabel(x.d)}</div>
      <div class="body"><div class="upTitle">${esc(x.t)}</div><div class="meta">${esc(x.m)}</div></div>
      <button class="icon" data-act="up-now" data-text="${esc(x.t)}" title="設為正在做" aria-label="設為正在做">▶</button></div>`).join('');
  });
  $('#upcomingList').innerHTML=html||'<div class="card empty">目前沒有有日期的事項。新增時選個日期，就會出現在這裡。</div>';
  return u.filter(x=>dayDiff(x.d)<=0).length;
}

function renderAll(){
  renderFocus();
  const nOpen=renderGeneral(),nCases=renderCases(),nUrgent=renderUpcoming();
  $('#n-general').textContent=nOpen||'';
  $('#n-cases').textContent=nCases||'';
  const up=$('#n-upcoming');up.textContent=nUrgent||'';up.className='n'+(nUrgent?' late':'');
}

/* ---------- 同步 ---------- */
async function loadItems(){const {data,error}=await client.from('capture_items').select('*').order('created_at',{ascending:true});if(error)throw error;items=data||[]}
async function loadCases(){
  const r=await client.from('capture_cases').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
  if(r.error)throw r.error;
  const list=r.data||[],next={};list.forEach(c=>next[c.id]=[]);
  if(list.length){
    const q=await client.from('capture_case_subtasks').select('*').in('case_id',list.map(c=>c.id)).order('created_at',{ascending:true});
    if(q.error)throw q.error;
    (q.data||[]).forEach(s=>(next[s.case_id]||(next[s.case_id]=[])).push(s));
  }
  cases=list;subs=next;
}
async function refresh(which='all'){
  if(!client||!user)return;
  pill('同步中…');
  try{if(which!=='cases')await loadItems();if(which!=='items')await loadCases();pill('● 已同步','ok')}
  catch(e){console.error(e);pill('同步失敗','bad')}
  renderAll();
}
let rt;function softRefresh(){clearTimeout(rt);rt=setTimeout(()=>refresh('all'),300)}
function subscribe(){
  if(channel)client.removeChannel(channel);
  channel=client.channel('capture-'+user.id);
  ['capture_items','capture_cases','capture_case_subtasks'].forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`user_id=eq.${user.id}`},softRefresh));
  channel.subscribe();
}
async function migrateLocal(){
  let raw=[];try{raw=JSON.parse(store.get(K.items,'[]'))}catch{}
  if(!raw.length)return;
  const existing=new Set(items.map(x=>x.id));
  const payload=raw.filter(x=>!existing.has(x.id)).map(x=>({id:x.id,user_id:user.id,content:x.text,planned_date:x.due||null,is_pinned:!!x.pin,is_completed:!!x.done,is_active:false,created_at:new Date(x.ts||Date.now()).toISOString(),updated_at:new Date(x.updated||x.ts||Date.now()).toISOString()}));
  if(!payload.length){store.set(K.items,'');return}
  const {error}=await client.from('capture_items').insert(payload);
  if(!error){store.set(K.items,'');await refresh('items')}
}

/* ---------- 登入流程 ---------- */
function gate(which){
  document.body.classList.add('locked');show('#gate',true);
  show('#connectCard',which==='connect');show('#loginCard',which==='login');
  pill(which==='login'?'待登入':'未連接');
}
async function startApp(){
  document.body.classList.remove('locked');show('#gate',false);
  $('#who').textContent=user.email||'';
  await refresh('all');await migrateLocal();subscribe();
}
async function init(){
  let cfg={};try{cfg=JSON.parse(store.get(K.cfg,'{}'))}catch{}
  if(!cfg.url||!cfg.key){gate('connect');return}
  $('#sbUrl').value=cfg.url;
  client=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}}=await client.auth.getSession();
  if(session?.user){user=session.user;startApp()}else gate('login');
}
$('#connectCard').addEventListener('submit',async e=>{
  e.preventDefault();
  const url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();
  if(!url||!key){$('#connectStatus').textContent='請填 Project URL 與 Publishable key。';return}
  if(key.startsWith('sb_secret')){$('#connectStatus').textContent='這是 Secret key，請改貼 Publishable key。';return}
  store.set(K.cfg,JSON.stringify({url,key}));$('#connectStatus').textContent='已儲存。';await init();
});
$('#loginCard').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#email').value.trim(),password=$('#password').value;
  $('#loginStatus').textContent='登入中…';
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error){$('#loginStatus').textContent='登入失敗：'+error.message;return}
  user=data.user;$('#loginStatus').textContent='';await startApp();
});

/* ---------- 新增 ---------- */
$('#captureForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const input=$('#captureInput'),content=input.value.trim();
  if(!content){input.focus();return}
  const planned_date=$('#dueDate').value||null;
  input.value='';$('#dueDate').value='';input.focus();
  if(!await run(client.from('capture_items').insert({user_id:user.id,content,planned_date}))){input.value=content;return}
  refresh('items');
});
$('#caseForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const el=$('#caseName'),name=el.value.trim();if(!name){el.focus();return}
  el.value='';
  if(!await run(client.from('capture_cases').insert({user_id:user.id,name}))){el.value=name;return}
  refresh('cases');
});
// 讀出一組欄位要寫進資料庫的值
function readDates(key){const v=r=>F(key,r)?(F(key,r).value||null):null;return{issue_date:v('from'),expiry_date:v('exp'),dhl_date:v('dhl')}}
async function addSub(cid){
  const key='c-'+cid,nameEl=F(key,'name');
  const content=nameEl.value.trim();if(!content){nameEl.focus();return}
  const t=F(key,'type').value,dts=readDates(key);
  const row={user_id:user.id,case_id:cid,content,status:F(key,'status').value.trim()||null,expiry_date:dts.expiry_date};
  if(dts.issue_date)row.issue_date=dts.issue_date;
  if(dts.dhl_date)row.dhl_date=dts.dhl_date;
  if(t!==guessType(content))row.doc_type=t;   // 名稱猜得到類型就不必另存
  nameEl.value='';F(key,'status').value='';const sel=F(key,'type');sel.value='general';delete sel.dataset.manual;rebuildDates(key,{});
  if(!await run(client.from('capture_case_subtasks').insert(row))){nameEl.value=content;return}
  refresh('cases');
}

/* ---------- 所有按鈕 ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const {act,id,cid}=b.dataset;
  const it=items.find(x=>x.id===id);
  const sub=cid?(subs[cid]||[]).find(x=>x.id===id):null;
  const cs=cid?cases.find(x=>x.id===cid):null;
  switch(act){
    case 'tab':setTab(b.dataset.tab);break;
    case 'date':$('#dueDate').value=b.dataset.off===''?'':todayISO(+b.dataset.off);break;
    case 'now':if(it)setCurrent(it.content);break;
    case 'sub-now':if(cs&&sub)setCurrent(cs.name+' › '+sub.content);break;
    case 'up-now':setCurrent(b.dataset.text);break;
    case 'back':returnPrev();break;
    case 'clearNow':clearCurrent();break;
    case 'done':
      if(!it)break;
      if(current===it.content){current='';store.set(K.now,'')}
      it.is_completed=true;it.updated_at=new Date().toISOString();renderAll();
      await run(client.from('capture_items').update({is_completed:true}).eq('id',id));refresh('items');break;
    case 'undo':
      if(!it)break;it.is_completed=false;renderAll();
      await run(client.from('capture_items').update({is_completed:false}).eq('id',id));refresh('items');break;
    case 'pin':
      if(!it)break;it.is_pinned=!it.is_pinned;renderAll();
      await run(client.from('capture_items').update({is_pinned:it.is_pinned}).eq('id',id));refresh('items');break;
    case 'del':
      if(it&&confirm(`刪除「${it.content}」？`)&&await run(client.from('capture_items').delete().eq('id',id)))refresh('items');break;
    case 'clearDone':{
      const ids=items.filter(x=>x.is_completed).map(x=>x.id);
      if(ids.length&&confirm(`刪除全部 ${ids.length} 筆已完成紀錄？刪除後無法復原。`)&&await run(client.from('capture_items').delete().in('id',ids)))refresh('items');
      break;}
    case 'sub-toggle':
      if(!sub)break;sub.is_completed=!sub.is_completed;renderAll();
      await run(client.from('capture_case_subtasks').update({is_completed:sub.is_completed}).eq('id',id));refresh('cases');break;
    case 'sub-del':
      if(sub&&confirm(`刪除子任務「${sub.content}」？`)&&await run(client.from('capture_case_subtasks').delete().eq('id',id)))refresh('cases');break;
    case 'sub-add':addSub(cid);break;
    case 'sub-tpl':{const key='c-'+cid,sel=F(key,'type');F(key,'name').value=b.dataset.name;sel.value=b.dataset.type;sel.dataset.manual='1';rebuildDates(key);
      (F(key,'from')||F(key,'dhl')||F(key,'status')).focus();break;}
    case 'sub-edit':openSubs.has(id)?openSubs.delete(id):openSubs.add(id);renderCases();
      if(openSubs.has(id))F('se-'+id,'name')?.scrollIntoView({block:'nearest',behavior:'smooth'});break;
    case 'sub-save':{
      if(!sub)break;const key='se-'+id;
      const content=F(key,'name').value.trim()||sub.content,t=F(key,'type').value,dts=readDates(key);
      const patch={content,status:F(key,'status').value.trim()||null,expiry_date:dts.expiry_date};
      if(dts.issue_date!==(sub.issue_date||null))patch.issue_date=dts.issue_date;
      if(dts.dhl_date!==(sub.dhl_date||null))patch.dhl_date=dts.dhl_date;
      const wantType=t===guessType(content)?null:t;
      if(wantType!==(sub.doc_type||null)&&!(wantType===null&&!sub.doc_type))patch.doc_type=wantType;
      const notes=F(key,'notes').value;if(notes!==(sub.notes||''))patch.notes=notes||null;
      if(await run(client.from('capture_case_subtasks').update(patch).eq('id',id))){
        const oldNow=cs.name+' › '+sub.content;
        if(current===oldNow&&content!==sub.content){current=cs.name+' › '+content;store.set(K.now,current)}
        openSubs.delete(id);refresh('cases');
      }
      break;}
    case 'sub-cleartask':
      if(sub&&await run(client.from('capture_case_subtasks').update({task_date:null}).eq('id',id)))refresh('cases');break;
    case 'case-del':
      if(cs&&confirm(`刪除案件「${cs.name}」與所有子任務？`)&&await run(client.from('capture_cases').delete().eq('id',cid))){openCases.delete(cid);store.set(K.open,JSON.stringify([...openCases]));refresh('cases')}
      break;
    case 'logout':
      await client?.auth.signOut();if(channel)client.removeChannel(channel);
      user=null;channel=null;items=[];cases=[];subs={};gate('login');pill('已登出');break;
    case 'reset':
      if(confirm('清除這台裝置的連接設定並重新設定？（雲端資料不受影響）')){store.set(K.cfg,'');location.reload()}break;
  }
});
const caseList=$('#caseList');
caseList.addEventListener('toggle',e=>{
  const d=e.target;if(!d.matches||!d.matches('details.caseCard'))return;
  d.open?openCases.add(d.dataset.cid):openCases.delete(d.dataset.cid);
  store.set(K.open,JSON.stringify([...openCases]));
},true);
caseList.addEventListener('focusout',async e=>{
  const t=e.target;if(!t.dataset||!t.dataset.note)return;
  const c=cases.find(x=>x.id===t.dataset.note);if(!c||(c.notes||'')===t.value)return;
  c.notes=t.value;
  if(await run(client.from('capture_cases').update({notes:t.value}).eq('id',c.id)))pill('● 備註已儲存','ok');
});
caseList.addEventListener('input',onField);
caseList.addEventListener('change',onField);
caseList.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();addSub(e.target.dataset.enter)}
});

function setTab(t){
  if(!['general','cases','upcoming'].includes(t))t='general';
  document.body.dataset.tab=t;store.set(K.tab,t);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  window.scrollTo({top:0});
}

setTab(store.get(K.tab,'general'));
renderFocus();
addEventListener('online',softRefresh);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user)softRefresh()});
init();

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
